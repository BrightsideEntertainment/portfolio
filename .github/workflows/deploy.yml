# Automatischer Deploy auf Hostpoint bei jedem Push auf main
name: Deploy to Hostpoint

on:
  push:
    branches: [main]
  workflow_dispatch: # manuell auslösbar im Tab "Actions"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Upload via FTPS auf Hostpoint
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          # Ordner deiner Subdomain auf Hostpoint (im Control Panel nachschauen, mit / am Ende)
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            includes/config.php
            uploads/**
